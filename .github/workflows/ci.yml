name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Mock Necesse Directory for Headless CI
        run: |
          mkdir -p ci-necesse/lib
          jar cf ci-necesse/Necesse.jar -C build . 2>/dev/null || touch ci-necesse/Necesse.jar

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Check Build Configuration
        run: ./gradlew --version
