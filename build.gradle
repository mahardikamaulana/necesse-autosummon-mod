plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
}

// Change the values below this to your mods values
// To change the project name, edit the settings.gradle file

project.ext.modID = "xeraphire.autosummon" // The unique id of your mod. Must be all lowercase and cannot use special characters.
project.ext.modName = "Auto Summon" // The display name of your mod.
project.ext.modVersion = "2.4.0" // Your current builds version. Must follow the xx.xx... format.
project.ext.gameVersion = "1.3.3" // The target game version.
project.ext.modDescription = "Automatically summons using the rightmost staff in your hotbar" // Short description of what your mod is.
project.ext.author = "Xeraphire" // Your name

/**
 * When setting clientside to true, it means servers do not need this mod for clients to connect and vice versa.
 * IMPORTANT: If you set this to true, make sure that your mod does not add any content or do anything
 * that could cause clients and servers to desync. This includes registering any items, objects, tiles, packets etc.
 */
project.ext.clientside = true

/**
 * The other mod dependencies of this mod
 * Dependencies define the default load order of mods
 * Uncomment and configure these if your mod has dependencies
 */
//project.ext.modDependencies = ["other.modid1", "other.modid2"]
project.ext.modOptionalDependencies = ["gagadoliano.summonerexpansion"]

// Resolve gameDirectory dynamically from env vars, Gradle properties, or OS standard paths
def resolveGameDirectory() {
    // 1. Check system environment variable
    def envDir = System.getenv("NECESSE_GAME_DIR") ?: System.getenv("NECESSE_HOME")
    if (envDir && file("${envDir}/Necesse.jar").exists()) {
        return envDir
    }

    // 2. Check Gradle project property (-PnecesseGameDir=... or in gradle.properties)
    if (project.hasProperty("necesseGameDir")) {
        def propDir = project.property("necesseGameDir").toString()
        if (file("${propDir}/Necesse.jar").exists()) {
            return propDir
        }
    }

    // 3. Check OS standard candidate locations
    def osName = System.getProperty("os.name").toLowerCase()
    def userHome = System.getProperty("user.home")
    def candidates = []

    if (osName.contains("mac")) {
        candidates << "${userHome}/Library/Application Support/Steam/steamapps/common/Necesse/Necesse.app/Contents/Resources"
        candidates << "${userHome}/Library/Application Support/Steam/steamapps/common/Necesse"
    } else if (osName.contains("win")) {
        candidates << "C:/Program Files (x86)/Steam/steamapps/common/Necesse"
        candidates << "C:/Program Files/Steam/steamapps/common/Necesse"
        candidates << "C:/SteamLibrary/steamapps/common/Necesse"
        candidates << "D:/SteamLibrary/steamapps/common/Necesse"
        candidates << "E:/SteamLibrary/steamapps/common/Necesse"
    } else {
        // Linux
        candidates << "${userHome}/.steam/steam/steamapps/common/Necesse"
        candidates << "${userHome}/.local/share/Steam/steamapps/common/Necesse"
    }

    for (candidate in candidates) {
        if (file("${candidate}/Necesse.jar").exists()) {
            return candidate
        }
    }

    // Fallback to default for OS
    return osName.contains("mac") ?
        "${userHome}/Library/Application Support/Steam/steamapps/common/Necesse/Necesse.app/Contents/Resources" :
        "C:/SteamLibrary/steamapps/common/Necesse"
}

def gameDirectory = resolveGameDirectory()

// =================================================
// ========== DO NOT EDIT BELOW THIS LINE ==========
// =================================================

// Name of the jar
def jarName = "${project.ext.modName.replace(" ", "")}-${project.ext.gameVersion}-${project.ext.modVersion}"

group project.ext.modID
version project.ext.modVersion

setSourceCompatibility(JavaVersion.VERSION_1_8)
setTargetCompatibility(JavaVersion.VERSION_1_8)

repositories {
    mavenCentral()
}

configurations {
    libDepends
}

sourceSets.main.output.resourcesDir = file("build/mod/resources/")
sourceSets.main.java.outputDir = file("build/mod/")
sourceSets.main.compileClasspath += configurations.libDepends // Adds libDepends configuration to classpath
def buildLocation = "build/jar/"

compileJava.options.encoding = "UTF-8"

if (!file(gameDirectory + "/Necesse.jar").exists()) {
    throw new GradleException(
        "Could not find Necesse game install directory at '${gameDirectory}'.\n" +
        "Please specify your Necesse installation path using any of the following methods:\n" +
        "  1. Set environment variable: NECESSE_GAME_DIR=/path/to/Necesse\n" +
        "  2. Add to gradle.properties: necesseGameDir=/path/to/Necesse\n" +
        "  3. Pass via command line: ./gradlew -PnecesseGameDir=/path/to/Necesse <task>"
    )
}

dependencies {
    implementation files(gameDirectory + "/Necesse.jar")
    implementation fileTree(gameDirectory + "/lib/")
    implementation fileTree("./mods/") // Add all mods located in local mods folder

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
}

test {
    useJUnitPlatform()
}

task createAppID {
    group "necesse"
    description "Creates steam_appid.txt file"

    doLast {
        file("steam_appid.txt").text = "1169040"
    }
}

task createModInfoFile(type: JavaExec) {
    group "necesse"
    description "Creates the mod info file"

    classpath = files(gameDirectory + "/Necesse.jar")

    main = "CreateModInfoFile"

    def infoArgs = [
        "-file", "${sourceSets.main.java.outputDir}/mod.info",
        "-id", "${project.ext.modID}",
        "-name", "${project.ext.modName}",
        "-version", "${project.ext.modVersion}",
        "-gameVersion", "${project.ext.gameVersion}",
        "-description", "${project.ext.modDescription}",
        "-author", "${project.ext.author}",
        "-clientside", "${project.ext.clientside}"
    ]
    if (project.ext.has("modDependencies") && project.ext.modDependencies) {
        infoArgs.addAll(["-dependencies", "[" + project.ext.modDependencies.join(", ") + "]"])
    }
    if (project.ext.has("modOptionalDependencies") && project.ext.modOptionalDependencies) {
        infoArgs.addAll(["-optionalDependencies", "[" + project.ext.modOptionalDependencies.join(", ") + "]"])
    }
    args infoArgs
}
// Makes compiling also create mod info file
classes.dependsOn("createModInfoFile")

task runClient(type: JavaExec) {
    group "necesse"
    description "Run client with current mod"
    dependsOn "buildModJar", "createAppID"

    classpath = files(gameDirectory + "/Necesse.jar")

    main = "StartSteamClient"
    jvmArgs "-Xms512m", "-Xmx4G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC", "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20", "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M"
    args "-dev", "-mod \"${buildLocation}\""
}

task runDevClient(type: JavaExec) {
    group "necesse"
    description "Run client with current mod"
    dependsOn "buildModJar", "createAppID"

    classpath = files(gameDirectory + "/Necesse.jar")

    main = "StartSteamClient"
    jvmArgs "-Xms512m", "-Xmx4G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC", "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20", "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M"
    args "-dev 1", "-mod \"${buildLocation}\""
}

task runServer(type: JavaExec) {
    group "necesse"
    description "Run server with current mod"
    dependsOn "buildModJar"

    classpath = files(gameDirectory + "/Server.jar")

    main = "StartDesktopServer"
    jvmArgs "-Xms512m", "-Xmx4G", "-XX:+UnlockExperimentalVMOptions", "-XX:+UseG1GC", "-XX:G1NewSizePercent=20", "-XX:G1ReservePercent=20", "-XX:MaxGCPauseMillis=50", "-XX:G1HeapRegionSize=32M"
    args "-mod \"${buildLocation}\""
}

task buildModJar(type: Jar) {
    group "necesse"
    description "Generates the mod jar into the build folder"
    dependsOn "classes"

    doFirst {
        fileTree(dir: buildLocation).exclude("${jarName}.jar").visit { details ->
            delete details.file
        }
    }

    // Add mod output
    from sourceSets.main.java.outputDir
    // Add the dependencies
    from configurations.libDepends.collect { it.isDirectory() ? it : zipTree(it) }

    archiveName "${jarName}.jar"
    destinationDir file(buildLocation)
}